apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-service
  namespace: microservices
  labels: #
    app: project-service
spec:
  replicas: 1 #kept at 1 - the in-memory repository isn't shared across pods, so a second replica would silently diverge (writes to one pod invisible to the other); see INTERVIEW-NOTES.md
  revisionHistoryLimit: 5 #
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: project-service
  template:
    metadata:
      labels:
        app: project-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: project-service
          #image: project-service:latest
          image: localhost:5000/project-service:latest #Here we are pushing project-service docker image into local docker repository
          imagePullPolicy: Always #Always #Never # this is used for pull image every time from local docker repository not remote docker repository when we build docker project-service image
          ports:
            - containerPort: 8082
          env:
            - name: EUREKA_URL
              valueFrom:
                configMapKeyRef:
                  name: microservices-config
                  key: eureka.url
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: microservices-config
                  key: otel.endpoint
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 40
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: project-service
  namespace: microservices
spec:
  selector:
    app: project-service
  ports:
    - port: 8082
      targetPort: 8082
  type: ClusterIP
