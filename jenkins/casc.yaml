jenkins:
  systemMessage: "Enterprise Microservices Observability Platform - CI/CD"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASSWORD:-admin123}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

tool:
  jdk:
    installations:
      - name: "JDK21"
        home: "/opt/jdk21"
  maven:
    installations:
      - name: "Maven_3"
        home: "/opt/maven"
  dockerTool:
    installations:
      - name: "Docker"
        home: "/usr/local"
