apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: microservices
  labels: #
    app: eureka-server
spec:
  replicas: 1 #kept at 1 - standalone Eureka replicas don't peer/share registry state, so 2 independent instances behind one Service would give clients an inconsistent view; see INTERVIEW-NOTES.md
  revisionHistoryLimit: 5 #
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8761"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: eureka-server
          #image: eureka-server:latest
          image: localhost:5000/eureka-server:latest #Here we are pushing eureka-server docker image into local docker repository
          imagePullPolicy: Always #Always #Never # this is used for pull image every time from local docker repository not remote docker repository when we build docker eureka-server image
          ports:
            - containerPort: 8761
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8761
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8761
            initialDelaySeconds: 40
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server
  namespace: microservices
spec:
  selector:
    app: eureka-server
  ports:
    - port: 8761
      targetPort: 8761
  type: ClusterIP
